[package]
name = "shield_ghita"
version = "0.1.0-beta3"
edition = "2021"
[features]
default = []
admin = ["dep:rcgen", "dep:tokio-rustls"]
[dependencies]
slint = "1.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.19"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
# Admin Edition panel HTTPS only (feature-gated: never compiled into public builds).
# ring provider matches the one reqwest/hyper-rustls already use in this tree.
rcgen = { version = "0.13", optional = true, default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.7"

[build-dependencies]
slint-build = "1.8"
winres = "0.1"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true