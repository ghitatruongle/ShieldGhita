name: Shield Ghita CI Engine

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Security Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Cargo Check
        run: cargo check --locked --all-targets --verbose

      - name: Run Test Suite
        run: cargo test --locked --verbose

      - name: Clippy Linter
        run: cargo clippy --locked --all-targets -- -D warnings

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Enforcing gate (0.1.5-alpha2): cargo-audit exits non-zero on any known
      # vulnerability, so a CVE in the dependency tree can no longer merge silently.
      # Warnings/unmaintained notices stay informational (exit 0).
      - name: Run dependency audit
        run: cargo audit
