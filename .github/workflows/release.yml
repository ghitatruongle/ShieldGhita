name: Shield Ghita Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-public-release:
    name: Build Public Release & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --release --verbose

      - name: Build Public Release Binary
        run: cargo build --release --verbose

      - name: Embed icons, manifest and versioninfo
        shell: pwsh
        run: python scripts/embed_resources.py target/release/shield_ghita.exe

      - name: Verify public binary has no admin markers
        shell: pwsh
        run: |
          $exe = "target\release\shield_ghita.exe"
          $markers = @("Cross-Subnet Port Sweep", "WS-Discovery UDP 3702", "BehaviorProfile", "AmbientWifiNode")
          foreach ($m in $markers) {
            $found = Select-String -Path $exe -Pattern $m -SimpleMatch -Quiet
            if ($found) {
              Write-Error "ADMIN MARKER LEAKED INTO PUBLIC BUILD: $m"
              exit 1
            }
          }
          Write-Host "Public binary clean: no admin module markers found."

      - name: Stage binary for installer packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release_std | Out-Null
          Copy-Item target/release/shield_ghita.exe target/release_std/shield_ghita.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compile public installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer_output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"installer_output" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer_output

      - name: Create GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ShieldGhita ${{ github.ref_name }}
          files: installer_output/ShieldGhita_Setup_*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: shield_ghita_public_${{ github.ref_name }}
          path: target/release_std/shield_ghita.exe
          if-no-files-found: error
